description "Man hinh cho lich (kindle-manhinhcho)"

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 10 600

# Chay ban sao trong /var/local de KHONG giu file nao trong /mnt/us
# (neu giu, Kindle khong vao duoc che do o USB khi cam may tinh).
script
    U=/mnt/us/manhinhcho
    R=/var/local/manhinhcho
    mkdir -p $R
    i=0
    while [ ! -f $U/manhinhcho.sh ] && [ $i -lt 300 ]; do sleep 2; i=$((i + 1)); done
    if [ -f $U/manhinhcho.sh ]; then
        cp $U/manhinhcho.sh $U/chung.sh $U/cauhinh.sh $R/ 2>/dev/null
    fi
    cd /
    exec /bin/sh $R/manhinhcho.sh
end script
