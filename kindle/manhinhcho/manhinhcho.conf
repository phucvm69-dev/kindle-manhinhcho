description "Man hinh cho lich (kindle-manhinhcho)"

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 10 600

# Chi chay ban da cai trong /var/local (root-only). KHONG doc code tu /mnt/us:
# - an toan: ai cam USB sua file cung khong chen duoc ma chay tu dong
# - khong giu file trong /mnt/us, nen Kindle vao duoc che do o USB
script
    cd /
    [ -f /var/local/manhinhcho/manhinhcho.sh ] || exit 0
    exec /bin/sh /var/local/manhinhcho/manhinhcho.sh
end script
