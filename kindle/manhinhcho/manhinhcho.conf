description "Man hinh cho lich (kindle-manhinhcho)"

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 5 300

script
    i=0
    while [ ! -f /mnt/us/manhinhcho/manhinhcho.sh ] && [ $i -lt 60 ]; do sleep 2; i=$((i + 1)); done
    exec /bin/sh /mnt/us/manhinhcho/manhinhcho.sh
end script
